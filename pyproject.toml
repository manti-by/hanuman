[project]
name = "hanuman"
version = "0.1.0"
description = "Hanuman is a classic RAG application"
readme = "README.md"
requires-python = ">=3.13.6,<3.14.0"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.14.3",
    "asyncio>=4.0.0",
    "langchain>=1.4.2",
    "langchain-core>=1.6.5",
    "langchain-openai>=1.0.0",
    "langchain-community>=0.4.2",
    "langchain-postgres>=0.0.18",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.3",
    "tiktoken>=0.14.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "langchain-huggingface>=1.2.2",
    "sentence-transformers>=6.1.0",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "debugpy>=1.8.22",
    "ipython>=9.17.1",
    "ty>=0.0.84",
    "pre-commit>=4.6.2",
    "uv-bump>=0.6.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
log_cli = true
log_cli_format = "%(levelname)s %(asctime)s %(message)s"
django_find_project = true
asyncio_mode = "auto"
addopts = '-p no:warnings --color=yes'
norecursedirs = '''
.git
.github
.pytest_cache
.ruff_cache
.venv
'''

[tool.bandit]
exclude_dirs = []
skips = ["B101", "B308", "B703"]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py313"
exclude = []

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # Pyflakes
    "N",  # pep8-naming
    "UP",  # pyupgrade
    "B",  # flake8-bugbear
    "S",  # flake8-bandit
    "BLE",  # flake8-blind-except
    "A",  # flake8-builtins
    "DJ",  # flake8-django
    "I",  # isort
    "INP",  # flake8-no-pep420
    "RUF"  # Ruff-specific rules
]
exclude = [
    ".git",
    ".idea",
    ".vscode",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
]
ignore = [
    "DJ001", # Null values for model char fields
    "ERA001",  # Disable eradicate (commented code removal)
    # Disable Conflicting lint rules,
    # see https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191",
    "E501",
    "E111",
    "E117",
    "D206",
    "D300",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "COM812",
    "COM819",
    "ISC001",
    "ISC002",
    "S603",
    # Disable unused `noqa` directive
    "RUF100",
    "RUF012",  # Mutable class attributes should be annotated with `typing.ClassVar`
    "N806",  # Variable `CONSTANT_NAME` in function should be lowercase
    "S105",  # Allow hardcoded default password in settings
]

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "third-party", "first-party", "hanuman", "local-folder"]
lines-after-imports = 2

[tool.ruff.lint.isort.sections]
"hanuman" = ["hanuman"]

[tool.ruff.lint.per-file-ignores]
# Ignore "E402", "F403", "F405" (import violations) in __init__.py files.
# Ignore "S" (flake8-bandit) and "N802" (function name should be lowercase) in tests and docs.
# Ignore "RUF" (Ruff-specific rules) and "I" (isort) in migrations.
"__init__.py" = ["E402", "F403", "F405"]
"**/{tests,docs}/*" = ["E402", "F403", "F405", "S", "N802", "N815"]
"**/*test*.py" = ["E402", "F403", "F405", "S", "N802"]
"**/{settings}/*" = ["E402", "F403", "F405"]
"**/migrations/*" = ["RUF", "I"]

[tool.ty.src]
exclude = [
    ".git",
    ".idea",
    ".vscode",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
]
